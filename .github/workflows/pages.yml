# Builds the results site (site/) from the committed data in site/public/data
# and deploys it to GitHub Pages when main is pushed. Nothing is exported and
# no model is called here: refreshing the data is a local step (README,
# Results site). Pages must be set to "GitHub Actions" in the repository
# settings once.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install the site's pinned dependencies
        working-directory: site
        run: npm ci
      - name: Typecheck
        working-directory: site
        run: npm run typecheck
      - name: Build under the repository's path
        working-directory: site
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
