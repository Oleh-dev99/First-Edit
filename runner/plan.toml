# The run queue for the second run (docs/SPEC.md, Run queue; D-048).
# `python -m first_edit run-next` works through the jobs in order. A job is a
# model, its variants, its briefs ("all" or a list) and its samples per brief
# and variant. Jobs marked parallel may run two at a time. A job with
# only_if_blocked runs only if one of the models it names is blocked.

runs_dir = "results/runs-run2"
out = "results/run2"

# Claude through the owner's subscription (D-047), 120 calls: held back.
# The isolation probe showed that `claude -p` still adds an identity line in
# front of our system prompt and a reminder with the account's email address
# and the date; no documented setting removes them with a subscription login.
# Uncomment only after the owner accepts that, or after the isolation is fixed.
