# Claude models through Claude Code's command line on the owner's
# subscription (D-047): `claude -p` with our system prompt replacing Claude
# Code's own and every tool disabled. model is the command line's alias;
# there is no URL, no key and no price (calls are not billed per call).

[[model]]
id = "cc-haiku"
provider = "claude-cli"
model = "haiku"
params = { effort = "medium" }

[[model]]
id = "cc-sonnet"
provider = "claude-cli"
model = "sonnet"
params = { effort = "medium" }

[[model]]
id = "cc-opus"
provider = "claude-cli"
model = "opus"
params = { effort = "medium" }
